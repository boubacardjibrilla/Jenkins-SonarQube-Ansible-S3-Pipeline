---
- name: Setup Tomcat on Amazon Linux 2023
  hosts: all
  become: yes
  vars:
    tomcat_version: "10.1.35"

  tasks:
    - name: Install Java 17 Corretto (Amazon Linux 2023)
      dnf:
        name: java-17-amazon-corretto-devel
        state: present

    - name: Download and unarchive Tomcat
      unarchive:
        src: "https://archive.apache.org/dist/tomcat/tomcat-10/v{{ tomcat_version }}/bin/apache-tomcat-{{ tomcat_version }}.tar.gz"
        dest: "/opt/"
        remote_src: yes
        creates: "/opt/apache-tomcat-{{ tomcat_version }}"

    - name: Create symbolic link for Tomcat
      file:
        src: "/opt/apache-tomcat-{{ tomcat_version }}"
        dest: "/opt/tomcat"
        state: link

    - name: Setting the roles in tomcat-users.xml file
      template:
        src: tomcat-users.xml
        dest: /opt/tomcat/conf/tomcat-users.xml

    - name: Configure context.xml for remote manager access
      template:
        src: context.xml
        dest: /opt/tomcat/webapps/manager/META-INF/context.xml

    - name: Create Tomcat systemd Service File
      copy:
        dest: /etc/systemd/system/tomcat.service
        content: |
          [Unit]
          Description=Apache Tomcat Server
          After=network.target

          [Service]
          User=root
          Group=root
          Type=forking
          Environment="JAVA_HOME=/usr/lib/jvm/java-17-amazon-corretto"
          Environment="CATALINA_HOME=/opt/tomcat"
          ExecStart=/opt/tomcat/bin/startup.sh
          ExecStop=/opt/tomcat/bin/shutdown.sh
          Restart=on-failure

          [Install]
          WantedBy=multi-user.target

    - name: Reload systemd daemon
      systemd:
        daemon_reload: yes

    - name: Start and enable Tomcat Service
      service:
        name: tomcat
        state: started
        enabled: yes
